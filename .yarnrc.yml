# Yarn 4, matching the official Desktop outer layer (see
# dsh-desktop-source/.yarnrc.yml). Packaging collects production dependencies
# through the pinned official app-builder-lib TraversalNodeModulesCollector,
# which walks a physical node_modules tree; a symlinked layout breaks it, so
# node-modules is mandatory here as well. Build scripts stay disabled and only
# the audited exceptions in dependenciesMeta may run.
nodeLinker: node-modules
enableScripts: false
