name: Verify Resources on Windows

# Windows pins the browse directory-picker backend, so the Project panel reaches a local
# directory through the Desktop runtime instead of the native seam. Only a real Windows
# runner composes that way, so the focused resource-state case runs there and uploads the
# captured panel states together with its result.json.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/resources-windows.yml'
      - 'package.json'
      - 'upstream.lock.json'
      - 'src/app/**'
      - 'src/desktop-adapter/**'
      - 'src/windows/**'
      - 'scripts/smoke-resource-states.mjs'
      - 'scripts/native-resource-state-case.mjs'
      - 'scripts/native-resource-state-checks.mjs'

permissions:
  contents: read

concurrency:
  group: resources-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktop_repository: ${{ steps.pins.outputs.desktop_repository }}
      desktop_commit: ${{ steps.pins.outputs.desktop_commit }}
      harness_repository: ${{ steps.pins.outputs.harness_repository }}
      harness_commit: ${{ steps.pins.outputs.harness_commit }}
      project_repository: ${{ steps.pins.outputs.project_repository }}
      project_commit: ${{ steps.pins.outputs.project_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Resolve immutable source pins
        id: pins
        env:
          PACKAGE_PLATFORM: win
        run: node scripts/ci-plan.mjs

  resources:
    needs: plan
    name: Resource panel on windows-2022
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          architecture: x64
      - name: Prepare Git and Corepack
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global core.symlinks true
          corepack enable
      # Import the pinned stable sources exactly as the packaging workflow does.
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.plan.outputs.desktop_repository }}
          ref: ${{ needs.plan.outputs.desktop_commit }}
          path: .cache/ci-sources/desktop
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.plan.outputs.harness_repository }}
          ref: ${{ needs.plan.outputs.harness_commit }}
          path: .cache/ci-sources/harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.plan.outputs.project_repository }}
          ref: ${{ needs.plan.outputs.project_commit }}
          path: .cache/ci-sources/project
          persist-credentials: false
      - name: Resolve Yarn download cache
        id: yarn-cache
        working-directory: .cache/ci-sources/desktop
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', '.cache/ci-sources/desktop/yarn.lock', '.cache/ci-sources/project/yarn.lock') }}
      - name: Install official locked dependencies
        working-directory: .cache/ci-sources/desktop
        run: corepack yarn install --immutable
      - name: Prepare official Electron and native bindings
        working-directory: .cache/ci-sources/desktop/dsh-plugin-desktop
        run: |
          node node_modules/electron/install.js
          corepack yarn prepare:electron-native
      - name: Install pinned plugin build dependencies
        working-directory: .cache/ci-sources/project
        run: corepack yarn install --immutable
      # This job used to build the pinned plugin without ever running its own suite,
      # which is how six platform-specific test gaps stayed invisible on Windows.
      - name: Export the pinned official runtime for the Project plugin
        working-directory: .cache/ci-sources/project
        run: corepack yarn run setup -- --desktop ../desktop
      - name: Verify the Project plugin on Windows
        working-directory: .cache/ci-sources/project
        run: corepack yarn run check
      - name: Install shell build dependencies
        run: corepack yarn install --immutable
      - name: Import verified stable snapshots and independent caches
        run: |
          corepack yarn run setup -- \
            --desktop-source .cache/ci-sources/desktop \
            --harness-source .cache/ci-sources/harness \
            --project-source .cache/ci-sources/project \
            --desktop-dependencies .cache/ci-sources/desktop/dsh-plugin-desktop/node_modules \
            --project-dependencies .cache/ci-sources/project/node_modules
      - name: Build the shell and Project plugin bundles
        run: corepack yarn run build
      - name: Verify the resource panel adds a local directory on Windows
        run: corepack yarn run smoke:resources
      - name: Upload resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resources-windows-${{ github.sha }}
          if-no-files-found: error
          # The smoke run keeps its evidence under the hidden .runtime directory.
          include-hidden-files: true
          path: |
            .runtime/resource-states-*/*.png
            .runtime/resource-states-*/result.json
