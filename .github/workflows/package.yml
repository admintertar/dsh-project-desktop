name: Official Desktop CI and Release
on:
  pull_request:
  push:
    branches: [master, codex/direct-official-desktop, codex/official-release-ci]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Native targets to build (publishing requires all)
        type: choice
        default: all
        options: [all, mac, win]
      publish:
        description: Publish all verified installers
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: official-desktop-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false
env:
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pins.outputs.matrix }}
      official_repository: ${{ steps.pins.outputs.official_repository }}
      official_commit: ${{ steps.pins.outputs.official_commit }}
      official_tag: ${{ steps.pins.outputs.official_tag }}
      project_repository: ${{ steps.pins.outputs.project_repository }}
      project_commit: ${{ steps.pins.outputs.project_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - id: pins
        env:
          PACKAGE_PLATFORM: ${{ inputs.platform || 'all' }}
          PACKAGE_PUBLISH: ${{ inputs.publish || startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/ci-plan.mjs
  package:
    needs: plan
    name: Verify and package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Configure checkout and package managers
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global core.symlinks true
          corepack enable
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.plan.outputs.official_repository }}
          ref: ${{ needs.plan.outputs.official_tag }}
          path: .cache/ci-sources/official
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.plan.outputs.project_repository }}
          ref: ${{ needs.plan.outputs.project_commit }}
          path: .cache/ci-sources/project
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false
      - name: Install official locked dependencies
        working-directory: .cache/ci-sources/official
        run: pnpm install --frozen-lockfile
      - name: Install Shell dependencies
        run: corepack yarn install --immutable
      - name: Install Project dependencies
        working-directory: .cache/ci-sources/project
        run: corepack yarn install --immutable
      - name: Build and verify official Desktop core packages
        run: node scripts/prepare-official-package-set.mjs .cache/ci-sources/official
      - name: Connect the pinned Project plugin
        run: corepack yarn setup --official-source .cache/ci-sources/official --project-source .cache/ci-sources/project
      - name: Check Project plugin on the native target
        working-directory: .cache/ci-sources/project
        run: corepack yarn check
      - name: Prepare locked official runtime and run official payload checks
        run: node scripts/prepare-official-runtime.mjs .cache/ci-sources/official
      - name: Check Shell source and build
        run: corepack yarn check
      - name: Verify real project windows and lifecycle
        run: corepack yarn smoke:official-shell
      - name: Build installer and verify relocated installed application
        env:
          PACKAGE_FAMILY: ${{ matrix.family }}
        run: node scripts/ci-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-project-desktop-${{ matrix.target }}-${{ github.sha }}
          path: |
            release/*/*.dmg
            release/*/*.exe
            release/*/*.zip
            release/*/*.sha256
            release/*/package-result.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: official-build-logs-${{ matrix.target }}-${{ github.sha }}
          path: .cache/official-runtime-logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
  publish:
    name: Publish verified release
    needs: [plan, package]
    if: ${{ needs.package.result == 'success' && (inputs.publish || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: project-desktop-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          pattern: dsh-project-desktop-*-${{ github.sha }}
          path: .cache/release-download
      - name: Verify all targets, upload a draft, publish and check the public update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs .cache/release-download
