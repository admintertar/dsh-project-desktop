name: Verify Guide on Windows

# The create guide is only accepted on the platform that renders it. This job
# runs the focused guide case on a real Windows x64 runner and uploads the
# captured create window, so the project path preview is verified with the
# separator that node:path.join actually uses there.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/guide-windows.yml'
      - 'package.json'
      - 'upstream.lock.json'
      - 'src/guide/**'
      - 'src/shared/**'
      - 'src/windows/**'
      - 'scripts/smoke-guide.mjs'
      - 'scripts/native-guide-case.mjs'
      - 'scripts/native-guide-checks.mjs'
      - 'scripts/native-guide-frame-checks.mjs'
      - 'scripts/native-guide-remote-checks.mjs'
      - 'scripts/native-guide-add-checks.mjs'
      - 'scripts/native-guide-loading-checks.mjs'

permissions:
  contents: read

concurrency:
  group: guide-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  DSH_TELEMETRY_DISABLED: '1'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      desktop_repository: ${{ steps.pins.outputs.desktop_repository }}
      desktop_commit: ${{ steps.pins.outputs.desktop_commit }}
      harness_repository: ${{ steps.pins.outputs.harness_repository }}
      harness_commit: ${{ steps.pins.outputs.harness_commit }}
      project_repository: ${{ steps.pins.outputs.project_repository }}
      project_commit: ${{ steps.pins.outputs.project_commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
      - name: Resolve immutable source pins
        id: pins
        env:
          PACKAGE_PLATFORM: win
        run: node scripts/ci-plan.mjs

  guide:
    needs: plan
    name: Create guide on windows-2022
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          architecture: x64
          cache: npm
      - name: Prepare Git and Corepack
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
          git config --global core.symlinks true
          corepack enable
      # Import the pinned stable sources exactly as the packaging workflow does.
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.plan.outputs.desktop_repository }}
          ref: ${{ needs.plan.outputs.desktop_commit }}
          path: .cache/ci-sources/desktop
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.plan.outputs.harness_repository }}
          ref: ${{ needs.plan.outputs.harness_commit }}
          path: .cache/ci-sources/harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ needs.plan.outputs.project_repository }}
          ref: ${{ needs.plan.outputs.project_commit }}
          path: .cache/ci-sources/project
          persist-credentials: false
      - name: Resolve upstream Yarn download cache
        id: yarn-cache
        working-directory: .cache/ci-sources/desktop
        run: echo "dir=$(corepack yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: desktop-yarn-${{ runner.os }}-${{ runner.arch }}-${{ needs.plan.outputs.desktop_commit }}
      - name: Install official locked dependencies
        working-directory: .cache/ci-sources/desktop
        run: corepack yarn install --immutable
      - name: Prepare official Electron and native bindings
        working-directory: .cache/ci-sources/desktop/dsh-plugin-desktop
        run: |
          node node_modules/electron/install.js
          corepack yarn prepare:electron-native
      - name: Install pinned plugin build dependencies
        working-directory: .cache/ci-sources/project
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install shell build dependencies
        run: npm ci --no-audit --no-fund
      - name: Import verified stable snapshots and independent caches
        run: |
          npm run setup -- \
            --desktop-source .cache/ci-sources/desktop \
            --harness-source .cache/ci-sources/harness \
            --project-source .cache/ci-sources/project \
            --desktop-dependencies .cache/ci-sources/desktop/dsh-plugin-desktop/node_modules \
            --project-dependencies .cache/ci-sources/project/node_modules
      - name: Build the shell and guide bundle
        run: npm run build
      - name: Verify the create guide project path preview on Windows
        run: npm run smoke:guide:focused
      - name: Upload guide evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guide-windows-${{ github.sha }}
          if-no-files-found: warn
          path: |
            .runtime/guide-frame-*/*.png
            .runtime/guide-frame-*/result.json
